[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "fmu-sumo"
version = "3.0.0" # x-release-please-version
description = "Compatibility package for fmu-sumo-explorer"
requires-python = ">=3.11"
license = { file = "LICENSE" }
authors = [{ name = "Equinor" }]
dependencies = [
  "fmu-sumo-explorer==3.0.0", # x-release-please-version
]
readme = { content-type = "text/markdown", text = """
The Explorer library has moved to [fmu-sumo-explorer](https://pypi.org/project/fmu-sumo-explorer/).
This compatibility package installs it under the old dependency name.
Python imports such as `from fmu.sumo.explorer import Explorer` are unchanged.

If you already have an older `fmu-sumo` release that contains the library,
uninstall `fmu-sumo` before installing either name. If an in-place upgrade
already broke imports, reinstall `fmu-sumo-explorer` with
`python -m pip install --force-reinstall --no-deps fmu-sumo-explorer` with
the exact version required by the installed compatibility package.
""" }

[project.urls]
Repository = "https://github.com/equinor/fmu-sumo-explorer"

[project.optional-dependencies]
all = [
  "fmu-sumo-explorer[all]==3.0.0", # x-release-please-version
]
dev = [
  "fmu-sumo-explorer[dev]==3.0.0", # x-release-please-version
]
test = [
  "fmu-sumo-explorer[test]==3.0.0", # x-release-please-version
]
docs = [
  "fmu-sumo-explorer[docs]==3.0.0", # x-release-please-version
]

[tool.setuptools]
packages = []
